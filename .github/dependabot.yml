version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '@sveltejs/kit'
        update-types: [version-update:semver-major]
      - dependency-name: '@sveltejs/adapter-static'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      svelte:
        patterns:
          - svelte
          - svelte-check
          - '@sveltejs/*'
      tooling:
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-*
          - typescript
          - typescript-eslint
          - prettier
          - prettier-*
          - vite
          - vitest
          - jsdom
          - '@testing-library/*'
          - '@playwright/test'
          - '@types/*'
          - globals
      fonts:
        patterns:
          - '@fontsource/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns:
          - '*'
